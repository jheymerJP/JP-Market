{% extends 'base.html' %}
{% block title %}Recuperar Contrasena - JP Market{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon"><i class="fas fa-key"></i></div>
                <h2>Recuperar Contrasena</h2>
                <p>Te enviaremos un enlace para restablecer tu contrasena</p>
            </div>
            <form method="POST" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Correo electronico</label>
                    <input type="email" name="email" class="form-input" placeholder="tu@correo.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-paper-plane"></i> Enviar Enlace
                </button>
            </form>
            <div class="auth-footer">
                <p><a href="{% url 'cuentas:login' %}">Volver al login</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
