{% extends 'base.html' %}
{% block title %}Nueva Contrasena - JP Market{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon"><i class="fas fa-lock"></i></div>
                <h2>Establecer Nueva Contrasena</h2>
            </div>
            <form method="POST" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Nueva contrasena</label>
                    <input type="password" name="new_password1" class="form-input" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Confirmar contrasena</label>
                    <input type="password" name="new_password2" class="form-input" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> Guardar Contrasena
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
