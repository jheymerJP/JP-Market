{% extends 'base.html' %}
{% block title %}Iniciar Sesion - JP Market{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon"><i class="fas fa-user-circle"></i></span>
            <h1>Bienvenido</h1>
            <p>Inicia sesion para continuar comprando</p>
        </div>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Usuario</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Tu usuario o email" required autofocus>
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Contrasena</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Tu contrasena" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesion
            </button>
        </form>

        <div class="auth-divider">
            <span>o continua con</span>
        </div>

        <a href="{% url 'google_login' %}" class="btn btn-google btn-block">
            <i class="fab fa-google"></i> Google
        </a>

        <div class="auth-footer">
            <p>No tienes cuenta? <a href="{% url 'cuentas:register' %}">Registrate gratis</a></p>
        </div>
    </div>
</div>
{% endblock %}
