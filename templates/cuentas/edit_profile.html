{% extends 'base.html' %}
{% block title %}Editar Perfil - JP Market{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon"><i class="fas fa-user-edit"></i></div>
                <h2>Editar Perfil</h2>
            </div>
            <form method="POST" class="auth-form">
                {% csrf_token %}
                <h3 class="form-section-title"><i class="fas fa-user"></i> Datos de Usuario</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre</label>
                        {{ u_form.first_name }}
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        {{ u_form.last_name }}
                    </div>
                </div>
                <div class="form-group">
                    <label>Correo</label>
                    {{ u_form.email }}
                </div>
                <h3 class="form-section-title"><i class="fas fa-id-card"></i> Datos Personales</h3>
                {{ p_form.as_p }}
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
                <a href="{% url 'cuentas:profile' %}" class="btn btn-outline btn-block">Cancelar</a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
